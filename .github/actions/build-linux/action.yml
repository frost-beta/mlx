name: 'Build and Test on Linux'

inputs:
  arch:
    description: 'Platform architecture tag'
    required: false
    default: ${{ runner.arch == 'arm64' && 'aarch64' || 'x86_64' }}
  toolkit:
    description: 'The toolkit to build with'
    required: false
    default: 'cpu'

runs:
  using: "composite"
  steps:
    - name: Install Python package
      id: python_build
      shell: sh
      env:
        DEBUG: 1
        CMAKE_ARGS: >-
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DMLX_BUILD_CUDA=${{ startsWith(inputs.toolkit, 'cuda') && 'ON' || 'OFF' }}
      run: |
        if ${{ startsWith(inputs.toolkit, 'cuda') && runner.arch == 'arm64' }} ; then
          # There is no GPU in arm64 runner, use a common arch.
          CMAKE_ARGS="$CMAKE_ARGS -DMLX_CUDA_ARCHITECTURES=90a"
          # Can not build tests when the built executables can not run.
          CMAKE_ARGS="$CMAKE_ARGS -DMLX_BUILD_TESTS=OFF"
        fi
        pip install --no-build-isolation -e ".[dev]" -v
        # Pass the CMAKE_ARGS to following steps.
        echo CMAKE_ARGS="$CMAKE_ARGS" >> $GITHUB_OUTPUT

    - name: Generate package stubs
      shell: sh
      run: |
        pip install typing_extensions
        python setup.py generate_stubs

    - name: Build CPP only
      shell: bash
      run: |
        cmake . -B build -DCMAKE_BUILD_TYPE=Debug ${{ steps.python_build.outputs.CMAKE_ARGS }}
        cmake --build build -j $(nproc)

    - name: Build wheel
      shell: sh
      env:
        DEBUG: 1
        CMAKE_ARGS: ${{ steps.python_build.outputs.CMAKE_ARGS }}
        # uv builds wheel from source dist which has no git information.
        DEV_RELEASE: 1
      run: |
        pip install auditwheel patchelf uv
        uv build
        auditwheel repair dist/mlx*.whl \
          --plat manylinux_2_39_${{ inputs.arch }} \
          --only-plat \
          --exclude libcublas* \
          --exclude libcuda* \
          --exclude libcudnn* \
          --exclude libnccl* \
          --exclude libnvrtc*

    - name: Upload wheel
      uses: actions/upload-artifact@v6
      with:
        overwrite: true
        name: linux-wheels-${{ inputs.arch }}-${{ inputs.toolkit }}
        path: wheelhouse/mlx*.whl
